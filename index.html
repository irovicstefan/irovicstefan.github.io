<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raspored sedenja</title>
  <meta name="description" content="Pretraga gostiju po imenu i pregled svih stolova.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f2eb;
      --surface: #fffdf9;
      --surface-2: #f0ebe2;
      --ink: #27241f;
      --muted: #7b7369;
      --faint: #b3aa9d;
      --line: #e5ddd0;
      --accent: #55694d;
      --accent-ink: #ffffff;
      --accent-soft: #e6ebdf;
      --mark: #f1dea6;
      --shadow: 0 1px 2px rgba(39, 36, 31, .04), 0 4px 16px rgba(39, 36, 31, .05);
      --radius: 16px;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #141513;
        --surface: #1c1e1b;
        --surface-2: #232622;
        --ink: #ece7df;
        --muted: #a0998e;
        --faint: #6b665e;
        --line: #2e312c;
        --accent: #a7bd97;
        --accent-ink: #141513;
        --accent-soft: #263023;
        --mark: #5d4c1c;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #141513;
      --surface: #1c1e1b;
      --surface-2: #232622;
      --ink: #ece7df;
      --muted: #a0998e;
      --faint: #6b665e;
      --line: #2e312c;
      --accent: #a7bd97;
      --accent-ink: #141513;
      --accent-soft: #263023;
      --mark: #5d4c1c;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

    /* Hero */
    .hero { text-align: center; padding: 56px 0 28px; position: relative; }
    .eyebrow {
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(40px, 8vw, 64px);
      line-height: 1.05;
      letter-spacing: -.01em;
    }
    .lede { margin: 12px auto 0; max-width: 34ch; color: var(--muted); }
    .ornament { display: block; margin: 18px auto 0; color: var(--faint); }

    .theme-btn {
      position: absolute;
      top: 16px;
      right: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--muted);
    }
    .theme-btn:hover { color: var(--ink); }
    .theme-btn svg { width: 18px; height: 18px; }
    .icon-sun { display: none; }
    :root[data-theme="dark"] .icon-sun { display: block; }
    :root[data-theme="dark"] .icon-moon { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .icon-sun { display: block; }
      :root:not([data-theme="light"]) .icon-moon { display: none; }
    }

    /* Search */
    .searchbar {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 12px 0;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }
    .search {
      max-width: 560px;
      margin: 0 auto;
      position: relative;
    }
    .search svg {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: var(--muted);
      pointer-events: none;
    }
    .search input {
      width: 100%;
      height: 56px;
      padding: 0 52px 0 50px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-size: 17px;
      box-shadow: var(--shadow);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .search input::placeholder { color: var(--faint); }
    .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
    .search input::-webkit-search-cancel-button { display: none; }
    .clear-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: none;
      place-items: center;
    }
    .clear-btn:hover { background: var(--surface-2); color: var(--ink); }
    .clear-btn svg { position: static; transform: none; width: 18px; height: 18px; }
    .has-query .clear-btn { display: grid; }
    .status {
      text-align: center;
      margin: 10px 0 0;
      font-size: 13px;
      color: var(--muted);
      min-height: 20px;
    }

    /* Search results */
    .results {
      max-width: 560px;
      margin: 8px auto 32px;
      display: grid;
      gap: 8px;
    }
    .results[hidden] { display: none; }
    .hit {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 14px 14px 14px 20px;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: border-color .15s, transform .15s;
    }
    .hit:hover { border-color: var(--accent); }
    .hit:active { transform: scale(.99); }
    .hit-name { flex: 1; min-width: 0; font-size: 18px; font-weight: 500; overflow-wrap: anywhere; }
    .hit-sub { display: block; font-size: 13px; color: var(--muted); font-weight: 400; margin-top: 2px; }
    .hit-table {
      flex-shrink: 0;
      min-width: 64px;
      height: 64px;
      padding: 0 10px;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-ink);
      display: grid;
      place-content: center;
      text-align: center;
      line-height: 1;
    }
    .hit-table small { font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
    .hit-table b { font-family: var(--serif); font-size: 32px; font-weight: 600; margin-top: 2px; font-variant-numeric: lining-nums; }
    .hit-table.mlad b { font-size: 22px; }
    mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

    /* Jump nav */
    .jump {
      margin: 36px 0 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    .jump button {
      min-width: 44px;
      height: 44px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .jump button:hover { border-color: var(--accent); color: var(--accent); }
    .jump .jump-mlad { font-family: var(--serif); font-size: 17px; font-style: italic; font-weight: 500; }
    .is-searching .jump { display: none; }

    /* Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
      padding-bottom: 24px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 20px 16px;
      scroll-margin-top: 110px;
      transition: border-color .2s, box-shadow .2s;
    }
    .card[hidden] { display: none; }
    .card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
    .card-title { display: flex; align-items: baseline; gap: 8px; }
    .card-label { font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .card-num { font-family: var(--serif); font-size: 40px; font-weight: 600; line-height: 1; font-variant-numeric: lining-nums; }
    .card-count { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .names { list-style: none; margin: 0; padding: 0; }
    .names li {
      display: flex;
      gap: 12px;
      padding: 6px 0;
      font-size: 15px;
      border-radius: 8px;
    }
    .names li + li { border-top: 1px dashed var(--line); }
    .seat {
      width: 20px;
      flex-shrink: 0;
      text-align: right;
      color: var(--faint);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      padding-top: 2px;
    }
    .names li.dim { opacity: .35; }
    .card.flash { border-color: var(--accent); animation: flash 1.6s ease-out; }
    @keyframes flash {
      0% { box-shadow: 0 0 0 0 var(--accent), var(--shadow); }
      30% { box-shadow: 0 0 0 6px var(--accent-soft), var(--shadow); }
      100% { box-shadow: var(--shadow); }
    }

    /* Mladenački sto */
    .card.mlad {
      grid-column: 1 / -1;
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 30%, var(--line));
      text-align: center;
      padding: 24px 20px 20px;
      margin-bottom: 8px;
    }
    .card.mlad .card-head { justify-content: center; flex-direction: column; align-items: center; gap: 4px; border-bottom-color: color-mix(in srgb, var(--accent) 25%, transparent); }
    .card.mlad .card-num { font-size: 34px; font-style: italic; font-weight: 500; }
    .card.mlad .names {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 10px;
      padding-top: 8px;
    }
    .card.mlad .names li { border: 0; padding: 6px 14px; background: var(--surface); border-radius: 999px; font-size: 15px; }
    .card.mlad .seat { display: none; }

    .empty {
      text-align: center;
      padding: 32px 16px 48px;
      color: var(--muted);
    }
    .empty[hidden] { display: none; }
    .empty p { margin: 4px 0; }
    .empty strong { font-family: var(--serif); font-size: 26px; font-weight: 500; color: var(--ink); display: block; margin-bottom: 4px; }

    footer {
      text-align: center;
      color: var(--faint);
      font-size: 13px;
      padding: 16px 0 48px;
    }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    @media (max-width: 560px) {
      .hero { padding-top: 64px; }
      .grid { grid-template-columns: 1fr; }
      .hit-name { font-size: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }

    @media print {
      .searchbar, .jump, .theme-btn, .results, .empty, .ornament { display: none !important; }
      body { background: #fff; color: #000; }
      .card { box-shadow: none; break-inside: avoid; }
      .card[hidden] { display: block !important; }
      .grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Promeni temu">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <p class="eyebrow">Dobro došli</p>
      <h1>Raspored sedenja</h1>
      <p class="lede">Pronađite gosta po imenu ili prezimenu.</p>
      <svg class="ornament" width="120" height="14" viewBox="0 0 120 14" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M0 7h48M72 7h48"/><path d="M60 1.5c2.5 3 2.5 8 0 11-2.5-3-2.5-8 0-11z"/><circle cx="52" cy="7" r="1.2" fill="currentColor" stroke="none"/><circle cx="68" cy="7" r="1.2" fill="currentColor" stroke="none"/></svg>
    </header>
  </div>

  <div class="searchbar" id="searchbar">
    <div class="wrap">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label for="q" class="sr-only">Pretraga gostiju</label>
        <input id="q" type="search" placeholder="Upišite ime ili prezime…" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <button class="clear-btn" id="clearBtn" type="button" aria-label="Obriši pretragu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </div>
  </div>

  <main class="wrap">
    <section class="results" id="results" hidden aria-label="Rezultati pretrage"></section>
    <nav class="jump" id="jump" aria-label="Brzi skok na sto"></nav>
    <section class="grid" id="grid"></section>
    <div class="empty" id="empty" hidden>
      <strong>Nismo pronašli to ime</strong>
      <p>Proverite pravopis ili probajte samo ime ili samo prezime.</p>
    </div>
  </main>

  <footer class="wrap" id="footer"></footer>

  <script src="data/raspored.js"></script>
  <script>
  (function () {
    'use strict';

    var DATA = window.RASPORED || { mladenacki: [], stolovi: [] };
    var $ = function (id) { return document.getElementById(id); };
    var root = document.documentElement;

    // ---------- Tema ----------
    function storageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function storageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    var savedTheme = storageGet('raspored-tema');
    if (savedTheme === 'light' || savedTheme === 'dark') root.setAttribute('data-theme', savedTheme);
    $('themeBtn').addEventListener('click', function () {
      var current = root.getAttribute('data-theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      var next = current === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      storageSet('raspored-tema', next);
    });

    // ---------- Normalizacija (bez obzira na č/ć/š/ž/đ i velika slova) ----------
    // Vraća normalizovan tekst i mapu: indeks u normalizovanom -> indeks u originalu.
    function normalizeWithMap(str) {
      var out = '', map = [];
      for (var i = 0; i < str.length; i++) {
        var ch = str[i];
        var n = ch.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
        if (n === 'đ') n = 'd';
        // "dj" tretiramo kao "đ" -> "d"
        if (n === 'j' && out[out.length - 1] === 'd') continue;
        for (var k = 0; k < n.length; k++) { out += n[k]; map.push(i); }
      }
      return { text: out, map: map };
    }
    function normalize(str) { return normalizeWithMap(str).text; }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // Vraća HTML imena sa <mark> oko pogođenih delova, ili null ako ne odgovara.
    // Svaka ukucana reč mora biti POČETAK neke reči u imenu, i to svaka druge reči
    // ("dragana ra" -> Dragana Radišić, ali ne i Dragana Novaković).
    function matchName(name, tokens) {
      var nm = normalizeWithMap(name);
      var words = [], re = /[a-z0-9]+/g, m;
      while ((m = re.exec(nm.text))) words.push({ start: m.index, text: m[0] });

      var used = [], assign = [];
      function solve(t) {
        if (t === tokens.length) return true;
        for (var w = 0; w < words.length; w++) {
          if (used[w] || words[w].text.indexOf(tokens[t]) !== 0) continue;
          used[w] = true; assign[t] = w;
          if (solve(t + 1)) return true;
          used[w] = false;
        }
        return false;
      }
      if (!solve(0)) return null;

      var ranges = tokens.map(function (tok, t) {
        var s = words[assign[t]].start;
        return [nm.map[s], nm.map[s + tok.length - 1] + 1];
      });
      ranges.sort(function (a, b) { return a[0] - b[0]; });
      var merged = [];
      ranges.forEach(function (r) {
        var last = merged[merged.length - 1];
        if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
        else merged.push(r.slice());
      });
      var html = '', pos = 0;
      merged.forEach(function (r) {
        html += escapeHtml(name.slice(pos, r[0])) + '<mark>' + escapeHtml(name.slice(r[0], r[1])) + '</mark>';
        pos = r[1];
      });
      return html + escapeHtml(name.slice(pos));
    }

    // ---------- Model ----------
    var tables = [];
    if (DATA.mladenacki && DATA.mladenacki.length) {
      tables.push({ id: 'mladenacki', mlad: true, title: 'Mladenački sto', guests: DATA.mladenacki });
    }
    DATA.stolovi.forEach(function (s) {
      tables.push({ id: 'sto-' + s.broj, broj: s.broj, title: 'Sto ' + s.broj, guests: s.gosti });
    });
    var regular = tables.filter(function (t) { return !t.mlad; });
    var totalGuests = regular.reduce(function (s, t) { return s + t.guests.length; }, 0);

    function guestWord(n) {
      var m10 = n % 10, m100 = n % 100;
      if (m10 === 1 && m100 !== 11) return 'gost';
      if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'gosta';
      return 'gostiju';
    }

    // ---------- Render ----------
    var grid = $('grid');
    tables.forEach(function (t) {
      var card = document.createElement('article');
      card.className = 'card' + (t.mlad ? ' mlad' : '');
      card.id = t.id;
      var head = t.mlad
        ? '<span class="card-num">Mladenački sto</span>'
        : '<span class="card-title"><span class="card-label">Sto</span><span class="card-num">' + t.broj + '</span></span>' +
          '<span class="card-count">' + t.guests.length + ' ' + guestWord(t.guests.length) + '</span>';
      card.innerHTML =
        '<header class="card-head">' + head + '</header>' +
        '<ol class="names">' + t.guests.map(function (g, i) {
          return '<li><span class="seat">' + (i + 1) + '</span><span class="nm">' + escapeHtml(g) + '</span></li>';
        }).join('') + '</ol>';
      t.el = card;
      t.items = Array.prototype.slice.call(card.querySelectorAll('li'));
      grid.appendChild(card);
    });

    var jump = $('jump');
    tables.forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = t.mlad ? 'Mladenački' : t.broj;
      if (t.mlad) b.className = 'jump-mlad';
      b.setAttribute('aria-label', t.title);
      b.addEventListener('click', function () { goTo(t.id); });
      jump.appendChild(b);
    });

    $('footer').textContent = regular.length + ' stolova · ' + totalGuests + ' ' + guestWord(totalGuests) +
      ' · uz Mladenački sto';

    // ---------- Navigacija ----------
    function goTo(id, opts) {
      var t = tables.filter(function (x) { return x.id === id; })[0];
      if (!t) return;
      if (!(opts && opts.keepSearch) && input.value) clearSearch();
      t.el.hidden = false;
      t.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      t.el.classList.remove('flash');
      void t.el.offsetWidth;
      t.el.classList.add('flash');
      try { history.replaceState(null, '', '#' + id); } catch (e) {}
    }

    // ---------- Pretraga ----------
    var input = $('q');
    var results = $('results');
    var status = $('status');
    var empty = $('empty');

    function clearSearch() {
      input.value = '';
      runSearch();
    }

    function runSearch() {
      var raw = input.value.trim();
      var q = normalize(raw);
      var tokens = q.split(/\s+/).filter(Boolean);
      var active = q.replace(/\s/g, '').length >= 2;
      document.body.classList.toggle('is-searching', active);
      $('searchbar').classList.toggle('has-query', raw.length > 0);

      if (!active) {
        tables.forEach(function (t) {
          t.el.hidden = false;
          t.items.forEach(function (li, i) {
            li.classList.remove('dim');
            li.querySelector('.nm').innerHTML = escapeHtml(t.guests[i]);
          });
        });
        results.hidden = true;
        results.innerHTML = '';
        empty.hidden = true;
        status.textContent = raw.length ? 'Upišite bar dva slova…' : '';
        return;
      }

      var hits = [];
      tables.forEach(function (t) {
        var any = false;
        t.items.forEach(function (li, i) {
          var html = matchName(t.guests[i], tokens);
          li.querySelector('.nm').innerHTML = html || escapeHtml(t.guests[i]);
          li.classList.toggle('dim', !html);
          if (html) { any = true; hits.push({ table: t, html: html }); }
        });
        t.el.hidden = !any;
      });

      results.innerHTML = hits.map(function (h, i) {
        var t = h.table;
        var badge = t.mlad
          ? '<span class="hit-table mlad"><small>Sto</small><b>★</b></span>'
          : '<span class="hit-table"><small>Sto</small><b>' + t.broj + '</b></span>';
        return '<button type="button" class="hit" data-i="' + i + '">' +
          '<span class="hit-name">' + h.html + '<span class="hit-sub">' + t.title + '</span></span>' + badge +
          '</button>';
      }).join('');
      Array.prototype.forEach.call(results.querySelectorAll('.hit'), function (btn) {
        btn.addEventListener('click', function () {
          goTo(hits[+btn.getAttribute('data-i')].table.id, { keepSearch: true });
        });
      });
      results.hidden = hits.length === 0;
      empty.hidden = hits.length !== 0;
      status.textContent = hits.length
        ? (hits.length === 1 ? 'Pronađen 1 gost' : 'Pronađeno ' + hits.length + ' ' + guestWord(hits.length))
        : '';
    }

    input.addEventListener('input', runSearch);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { clearSearch(); }
      if (e.key === 'Enter') {
        var first = results.querySelector('.hit');
        if (first) { first.click(); input.blur(); }
      }
    });
    $('clearBtn').addEventListener('click', function () { clearSearch(); input.focus(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === '/' && document.activeElement !== input) { e.preventDefault(); input.focus(); }
    });

    // ---------- Početno stanje iz URL-a (?ime=… ili #sto-7) ----------
    var params = new URLSearchParams(location.search);
    if (params.get('ime')) { input.value = params.get('ime'); runSearch(); }
    else if (location.hash) {
      var id = decodeURIComponent(location.hash.slice(1));
      setTimeout(function () { goTo(id); }, 50);
    }
  })();
  </script>
</body>
</html>
